name: Bootstrap Thai Life Talk

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6

      - name: Copy approved Thai site from source branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch 'feat/thai-native-swipe-official-audio' \
            https://github.com/succuvivi/english-deep-talk-plan.git "$tmp/source"
          cp -a "$tmp/source/thai/." .
          mkdir -p tools
          cp "$tmp/source/tools/import_thai_audio.mjs" tools/import_thai_audio.mjs
          cp "$tmp/source/tools/import_thai_audio_generator.mjs" tools/import_thai_audio_generator.mjs
          cp "$tmp/source/tools/run_thai_audio_import.mjs" tools/run_thai_audio_import.mjs
          rm -rf "$tmp"

      - name: Commit migrated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html learn.html audio-sources.html styles.css package.json js data audio tests tools
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: import approved Thai site baseline"
          git push
