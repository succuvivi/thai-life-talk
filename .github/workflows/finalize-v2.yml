name: Finalize Thai Life Talk v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-v2.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  finalize:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Restore exact standalone project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-payload/part-* | base64 -d | tar -xJf - -C .

      - name: Run complete tests
        run: npm test

      - name: Check JavaScript syntax
        run: find js data tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Verify content and human-audio coverage
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { SCENES } from './data/scenes.js';
          import { ENTRIES } from './data/index.js';
          import { AUDIO_BY_ENTRY_ID } from './data/audio-map.js';
          assert.equal(SCENES.length, 18);
          assert.equal(ENTRIES.length, 360);
          assert.equal(Object.keys(AUDIO_BY_ENTRY_ID).length, 19);
          console.log(`Scenes: ${SCENES.length}`);
          console.log(`Entries: ${ENTRIES.length}`);
          console.log(`Human word audio: ${Object.keys(AUDIO_BY_ENTRY_ID).length} / ${ENTRIES.length}`);
          console.log(`Device-TTS fallback: ${ENTRIES.length - Object.keys(AUDIO_BY_ENTRY_ID).length} / ${ENTRIES.length}`);
          NODE

      - name: Guard native swipe and public runtime
        shell: bash
        run: |
          if grep -R -E 'data-series-nav|class="series-nav' index.html learn.html js styles.css; then
            echo 'Legacy series arrow navigation found'
            exit 1
          fi
          if grep -R -E 'API_KEY|aiforthai|api\.aiforthai' index.html learn.html audio-sources.html js data; then
            echo 'Public runtime contains an API-key/provider hook'
            exit 1
          fi

      - name: Prepare non-workflow commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-payload
          rm -f .github/workflows/import-thai-audio.yml
          rm -f .github/workflows/pages.yml
          rm -f .github/workflows/qa.yml
          git add -A
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo 'Refusing to push workflow mutations from GITHUB_TOKEN.'
            exit 1
          fi

      - name: Commit standalone project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: launch standalone Thai Life Talk"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
